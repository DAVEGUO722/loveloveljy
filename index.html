<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVE and JANE </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 20px;
            margin-top: 20px;
            text-align: center;
        }
        h1 {
            color: #ff477e;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }
        /* 计时器样式 */
        .counter {
            background: #fff0f3;
            border: 2px dashed #ff758c;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 40px;
        }
        .counter h3 {
            color: #ff5c8a;
            margin-bottom: 10px;
        }
        #time-elapsed {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        /* 照片墙样式 */
        .photo-section {
            margin-bottom: 30px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .photo-card {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .photo-card:hover {
            transform: translateY(-5px);
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
        }
        .photo-desc {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #555;
        }
        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Our Love Story ❤️</h1>
        <p class="subtitle">胖嘟嘟照片</p>

        <!-- （请把下面的日期改成你们在一起的日子，格式：YYYY-MM-DD） -->
        <div class="counter">
            <h3>bound to love</h3>
            <div id="time-elapsed">计算中...</div>
        </div>

        <!-- 照片展示区 -->
        <div class="photo-section">
            <h2 style="color: #ff5c8a; font-size: 1.5rem; margin-bottom: 15px;">memory</h2>
            <div class="photo-grid">
                <!-- 照片 1 -->
                <div class="photo-card">
                    <!-- 请把 src="photo1.jpg" 改成你上传到仓库里的照片文件名，或者直接填图片的在线链接 -->
                    <img src="photo1.jpg" alt=" 李佳仪">
                    <div class="photo-desc">first trip ✈️</div>
                </div>
                <!-- 照片 2 -->
                <div class="photo-card">
                    <img src="photo2.jpg" alt=" 李佳仪">
                    <div class="photo-desc">chocolate factory 🍰</div>
                </div>
                <!-- 照片 3 -->
                <div class="photo-card">
                    <img src="photo3.jpg" alt="地狱火">
                    <div class="photo-desc">original day ✨</div>
                </div>
            </div>
        </div>

        <footer>
            <p>胖嘟嘟 库儿 博德 小火人</p>
        </footer>
    </div>

    <script>
        // ==========================================
        // 修改这里的日期为你们在一起的具体年月日
        // ==========================================
        const startDate = new Date("2026-04-29T00:00:00"); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("time-elapsed").innerHTML = 
                `${days} 天 ${hours} 小时 ${minutes} 分钟 ${seconds} 秒`;
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
