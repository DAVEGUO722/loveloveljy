<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVE and JANE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 20px;
            margin-top: 20px;
            text-align: center;
        }
        h1 {
            color: #ff477e;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }
        /* 计时器样式 */
        .counter {
            background: #fff0f3;
            border: 2px dashed #ff758c;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 40px;
        }
        .counter h3 {
            color: #ff5c8a;
            margin-bottom: 10px;
        }
        #time-elapsed {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        /* 照片墙样式 */
        .photo-section {
            margin-bottom: 30px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .photo-card {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .photo-card:hover {
            transform: translateY(-5px);
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }
        .photo-desc a {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #ff5c8a;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: color 0.2s;
            cursor: pointer;
        }
        .photo-desc a:hover {
            color: #ff477e;
            text-decoration: underline;
        }
        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #777;
        }

        /* 相册弹窗样式 */
        #album-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .album-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            text-align: center;
        }
        .album-content h2 {
            color: #ff477e;
            margin-bottom: 20px;
        }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .album-grid img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .album-grid img:hover {
            transform: scale(1.03);
        }
        #album-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            color: #aaa;
            cursor: pointer;
        }
        #album-close:hover {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1> Dave❤️Jane
        郭亚轩❤️李佳仪 </h1>
        <p class="subtitle">老婆我现在肚子好饿你还在那上课</p>

        <!-- 计时器 -->
        <div class="counter">
            <h3>'bound to love' recorder : 轩轩 loves 美美 more with each extra second</h3>
            <div id="time-elapsed">计算中...</div>
        </div>

        <!-- 照片展示区（封面） -->
        <div class="photo-section">
            <h2 style="color: #ff5c8a; font-size: 1.5rem; margin-bottom: 15px;">memory</h2>
            <div class="photo-grid">
                <!-- 照片 1 组 -->
                <div class="photo-card">
                    <img src="photo1.jpg" alt="李佳仪" onclick="openAlbum('first')">
                    <div class="photo-desc">
                        <a onclick="openAlbum('first')">first trip ✈️ izu</a>
                    </div>
                </div>
                <!-- 照片 2 组 -->
                <div class="photo-card">
                    <img src="photo2.jpg" alt="李佳仪" onclick="openAlbum('chocolate')">
                    <div class="photo-desc">
                        <a onclick="openAlbum('chocolate')">chocolate factory 🍰 sapporo</a>
                    </div>
                </div>
                <!-- 照片 3 组 -->
                <div class="photo-card">
                    <img src="photo3.jpg" alt="地狱火" onclick="openAlbum('original')">
                    <div class="photo-desc">
                        <a onclick="openAlbum('original')">original day ✨ tokyo</a>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>             孩子们
                胖嘟嘟 库儿 博德 小火人 suki 吉伊 卡皮巴拉</p>
        </footer>
    </div>

    <!-- 相册弹窗 -->
    <div id="album-modal" onclick="closeAlbum(event)">
        <div class="album-content" onclick="event.stopPropagation()">
            <span id="album-close" onclick="closeAlbumDirect()">&times;</span>
            <h2 id="album-title">相册标题</h2>
            <div class="album-grid" id="album-images">
                <!-- 动态填充多张照片 -->
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 在这里配置每个主题下的“多张照片”
        // 你可以随时增减图片文件名
        // ==========================================
        const albumsData = {
            first: {
                title: "first trip ✈️ izu 相册",
                images: [
                    "photo1.jpg"
                
                ]
            },
            chocolate: {
                title: "chocolate factory 🍰 sapporo 相册",
                images: [
                    "photo2.jpg",
                    "photo2_extra1.jpg",
                    "photo2_extra2.jpg",
                    "photo2_extra3.jpg",
                    "photo2_extra4.jpg",
                    "photo2_extra5.jpg",
                    "photo2_extra6.jpg",
                    "photo2_extra7.jpg",
                    "photo2_extra8.jpg",
                    "photo2_extra9.jpg",
                    
                
                    
                ]
            },
            original: {
                title: "original day ✨ tokyo相册",
                images: [
                    "photo3.jpg",
                    "photo3_extra1.jpg",
                    "photo3_extra2.jpg"
                ]
            }
        };

        // 计时器逻辑
        const startDate = new Date("2026-04-29T00:00:00"); 
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            document.getElementById("time-elapsed").innerHTML = 
                `${days} 天 ${hours} 小时 ${minutes} 分钟 ${seconds} 秒`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // 打开相册弹窗
        function openAlbum(category) {
            const modal = document.getElementById("album-modal");
            const titleEl = document.getElementById("album-title");
            const gridEl = document.getElementById("album-images");

            const album = albumsData[category];
            titleEl.innerText = album.title;
            
            // 清空并重新生成相册里的图片
            gridEl.innerHTML = "";
            album.images.forEach(imgSrc => {
                const img = document.createElement("img");
                img.src = imgSrc;
                img.alt = "回忆照片";
                // 点击小图也可以做进一步处理（比如直接预览大图，这里简单展示）
                gridEl.appendChild(img);
            });

            modal.style.display = "flex";
        }

        // 关闭相册弹窗
        function closeAlbum(event) {
            document.getElementById("album-modal").style.display = "none";
        }
        function closeAlbumDirect() {
            document.getElementById("album-modal").style.display = "none";
        }
    </script>
</body>
</html>
